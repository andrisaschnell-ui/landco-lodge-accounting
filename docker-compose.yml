version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lanacc-web
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - api
    networks:
      - lanacc-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: lanacc-api
    ports:
      - "4000:4000"
    volumes:
      - ./api:/app
      - ./scripts:/app/scripts
      - ./db/backups:/app/backups
      - /app/node_modules
    environment:
      - DATABASE_URL=postgres://postgres:root@db:5432/landco_v2_db
      - BACKUP_DIR=/app/backups
      - JWT_SECRET=landco-secret-key-2026
      - COMPANY_NAME=Landco Lodge Lda
      - COMPANY_NUIT=123456789
      - COMPANY_ADDRESS=Vilankulo, Mozambique
      - AT_SIGNING_KEY=default-secret-key-2026
    depends_on:
      - db
    networks:
      - lanacc-net

  db:
    image: postgres:15-alpine
    container_name: lanacc-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: landco_v2_db
    ports:
      - "5432:5432"
    volumes:
      - lanacc-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - lanacc-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lanacc-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@landco.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - lanacc-net

volumes:
  lanacc-pgdata:
    name: lanacc-pgdata-volume

networks:
  lanacc-net:
    name: lanacc-network
    driver: bridge
