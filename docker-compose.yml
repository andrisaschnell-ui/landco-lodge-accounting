version: '3.8'

# All secrets in this file come from .env.local at the project root.
# Always start the stack with:
#     docker compose --env-file .env.local up -d --build
# scripts\start.bat does this for you and aborts if .env.local is missing.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lanacc-web
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-http://localhost:4000}
    depends_on:
      - api
    networks:
      - lanacc-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: lanacc-api
    ports:
      - "0.0.0.0:4000:4000"
    volumes:
      - ./api:/app
      - ./scripts:/app/scripts
      - ./db/backups:/app/backups
      # USB drive mounts (Windows host). Uncomment only drives currently plugged in.
      # - E:/:/mnt/usb_e
      # - F:/:/mnt/usb_f
      # - G:/:/mnt/usb_g
      # - H:/:/mnt/usb_h
      - /app/node_modules
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - did you start with --env-file .env.local?}@db:5432/landco_v2_db
      - BACKUP_DIR=/app/backups
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET missing in .env.local}
      - COMPANY_NAME=Landco Lodge Lda
      - COMPANY_NUIT=123456789
      - COMPANY_ADDRESS=Vilankulo, Mozambique
      - AT_SIGNING_KEY=${AT_SIGNING_KEY:?AT_SIGNING_KEY missing in .env.local}
      - SUPABASE_URL=https://neakxehuonsrlvjrxhnd.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lYWt4ZWh1b25zcmx2anJ4aG5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODcyMzUsImV4cCI6MjA5Mjk2MzIzNX0.m9cL7bDv5jRFjBqmzxOYLus36ptEoY-BVdY7ohncMhg
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    depends_on:
      - db
    networks:
      - lanacc-net

  db:
    image: postgres:17-alpine
    container_name: lanacc-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env.local}
      POSTGRES_DB: landco_v2_db
    ports:
      - "5432:5432"
    volumes:
      - lanacc-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - lanacc-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lanacc-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@landco.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - lanacc-net

volumes:
  lanacc-pgdata:
    name: lanacc-pgdata-volume

networks:
  lanacc-net:
    name: lanacc-network
    driver: bridge
